# developer.1platform.pro — contrato de servido, traducido regla por regla desde
# `deploy/cpanel/htaccess/docs.htaccess`.
#
# Ese archivo existe porque el origen viejo NO tenía .htaccess propio y heredaba
# el de WordPress del directorio padre. Medido el 2026-07-31, antes de escribirlo:
#   GET /no-existe  → 500  (RewriteRule . /index.php sobre un index.php ausente)
#   GET /img/       → 200  con el listado de directorio de Apache
#   GET /openapi/   → 200  con el listado de directorio de Apache
# El contrato arregla las tres cosas y este nginx las mantiene arregladas.
#
# ── REGLA DURA ───────────────────────────────────────────────────────────────
# Nada acá puede forzar HTTPS sobre el mismo host: la zona de Cloudflare habla
# HTTP plano con este origen ⇒ sería un bucle infinito.

# Catch-all: un Host ajeno no recibe el sitio de docs.
# MEDIDO en el repo hermano de esta épica: con un solo `server{}`, nginx toma el
# primero como default y `server_name` no discrimina por sí solo.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name developer.1platform.pro;

    root /usr/share/nginx/html;

    # Apache: `DirectoryIndex index.html`
    index index.html;

    # Apache: `Options -Indexes`
    autoindex off;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        image/svg+xml;

    # ⚠️ `add_header` no se hereda de forma acumulativa: uno en un bloque hijo
    # descarta todos los del padre. Por eso se repite en cada location.
    add_header X-Content-Type-Options "nosniff" always;

    # Docusaurus le pone hash a lo de /assets/: el nombre cambia con los bytes.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # De acá lee Scalar sus specs. Los archivos se sirven; el DIRECTORIO no
    # (ver el bloque de abajo). Sin revalidación un spec nuevo sería invisible.
    location ^~ /openapi/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(html|xml|txt|json)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(woff2|ico|png|jpg|jpeg|webp|avif|svg)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── La regla central del contrato ───────────────────────────────────────
    # Apache:
    #   RewriteCond %{REQUEST_FILENAME} -d
    #   RewriteCond %{REQUEST_FILENAME}/index.html !-f
    #   RewriteRule ^ - [R=404,L]
    #
    # Un directorio real SIN index.html (`/img/`, `/openapi/`, `/fonts/`) no es
    # una ruta del sitio: no existe. Con sólo `autoindex off` nginx contesta
    # **403**, que dice "no podés listarlo" cuando la verdad es "no hay nada
    # acá" — y encima no sirve la 404 de marca.
    #
    # `try_files $uri $uri/index.html =404` es lo que produce el 404: NO se usa
    # `$uri/` porque ése deriva al handler de índice y termina en 403.
    # T-9b sondea `/openapi/` y `/img/` justamente para distinguir 404 de 403.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html =404;
    }

    # ── ErrorDocument 404 /404.html ─────────────────────────────────────────
    # SIN fallback de SPA a propósito: esto es un sitio de documentación, no una
    # SPA. Un fallback convertiría cada enlace roto en un 200 y los enmascararía.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
