name: 1Platform API Developer — QA

# Canal de QA de developer.1platform.pro → `developer-qa.1platform.pro`, servido
# desde el DEDICADO (144.76.163.230) detrás del front door (185.125.168.236).
#
# Hasta el 2026-11-04 publicaba por FTPS a la cuenta cPanel compartida
# `karefxzp`, que el proveedor suspendió (#92). Por decisión del dueño cPanel ya
# no se usa: mismo molde que el QA del panel del Core (dashboard#781).
#
# Cómo publica: el runner arma un tar.gz con { html/ (el build), nginx.conf } y
# lo manda por SSH con una llave RESTRINGIDA (`restrict,command=…`) cuyo único
# comando posible es `/usr/local/bin/developer-qa-receive <SHA>`. El receptor
# valida el paquete (sin rutas absolutas, sin `..`, sin enlaces), corre
# `nginx -t`, levanta `1platform-api-developer-qa` (nginx de sólo lectura,
# :3050→8080) y sólo responde `served <SHA>` si `/__qa-version` devuelve ese
# SHA; si no, repone el release anterior. La llave no puede abrir una shell: un
# PR que alterara este workflow sólo podría publicar otro sitio estático en QA,
# que es lo mismo que ya podía hacer con el canal anterior.
#
# El nginx.conf de QA se DERIVA del de PROD (deploy/qa/build-qa-conf.sh): QA
# sirve con las mismas redirecciones, 404 y cabeceras que producción.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (QA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        # La versión sale de `packageManager` en package.json. Pinearla acá
        # además hace que pnpm/action-setup aborte con "Multiple versions of
        # pnpm specified" y se salte todo lo que viene después, deploy incluido.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build-qa-${{ github.run_id }}
          path: build/
          retention-days: 7

  deploy:
    name: Deploy to QA (dedicado)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: QA
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build-qa-${{ github.run_id }}
          path: build/

      - name: Assemble package (html/ + nginx.conf)
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          mkdir -p pkg
          cp -R build pkg/html
          bash deploy/qa/build-qa-conf.sh deploy/docker/nginx.conf pkg/nginx.conf
          tar -C pkg -czf qa.tgz html nginx.conf
          echo "paquete $(du -h qa.tgz | cut -f1)"

      - name: Publish to the dedicated QA receiver
        env:
          QA_DEPLOY_SSH_KEY: ${{ secrets.QA_DEPLOY_SSH_KEY }}
          QA_DEPLOY_KNOWN_HOSTS: ${{ secrets.QA_DEPLOY_KNOWN_HOSTS }}
          QA_DEPLOY_HOST: ${{ vars.QA_DEPLOY_HOST }}
          QA_DEPLOY_USER: ${{ vars.QA_DEPLOY_USER }}
          QA_DEPLOY_PORT: ${{ vars.QA_DEPLOY_PORT }}
          # Lo que se construyó: en `pull_request` es el merge del PR con main.
          CANDIDATE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for v in QA_DEPLOY_SSH_KEY QA_DEPLOY_KNOWN_HOSTS QA_DEPLOY_HOST QA_DEPLOY_USER QA_DEPLOY_PORT; do
            [ -n "${!v}" ] || { echo "::error::${v} no está configurado en el environment QA"; exit 1; }
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$QA_DEPLOY_SSH_KEY" > ~/.ssh/qa_deploy
          printf '%s\n' "$QA_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          out="$(ssh -i ~/.ssh/qa_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$QA_DEPLOY_PORT" "${QA_DEPLOY_USER}@${QA_DEPLOY_HOST}" "$CANDIDATE" < qa.tgz)"
          rm -f ~/.ssh/qa_deploy
          echo "$out"
          [ "$out" = "served ${CANDIDATE}" ] || { echo "::error::el receptor no confirmó served ${CANDIDATE}"; exit 1; }

      # El receptor ya probó el contenedor por 127.0.0.1. Esto prueba el camino
      # público (Cloudflare → front door → :3050), con control negativo.
      - name: Verify the release is served publicly
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CANDIDATE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            got="$(curl -s --max-time 10 "${SITE_URL}/__qa-version?n=${i}" || true)"
            [ "$got" = "$CANDIDATE" ] && break
            sleep 5
          done
          [ "$got" = "$CANDIDATE" ] || { echo "::error::${SITE_URL}/__qa-version no sirve ${CANDIDATE} (último: ${got:0:80})"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${SITE_URL}$1"; }
          [ "$(code /index.html)" = 200 ] || { echo "::error::/index.html no da 200"; exit 1; }
          [ "$(code /__ruta-que-no-existe__)" = 404 ] || { echo "::error::una ruta inexistente no da 404"; exit 1; }
          echo "::notice::QA activa en ${SITE_URL} con ${CANDIDATE}"
