# Configuración de gitleaks para 1platform-api-developer.
# Documenta los ÚNICOS falsos-positivos permitidos: ejemplos ilustrativos en la documentación
# de la API. Este repositorio ES el portal de desarrolladores público, así que el corpus de
# ejemplos `ak-…`/`sk-…` del modelo dos-token vive acá por diseño y daría falso positivo en
# cada PR sin este allowlist.
#
# Re-medido 2026-10-12 sobre main (645a3fe): 17 hallazgos sin allowlist, 1 que la config de
# septiembre no cubría (resuelto abajo); 7 entradas viejas sin uso, quitadas.
#
# IMPORTANTE (seguridad): los regexes del allowlist son **anclados/acotados** para que
# NO silencien credenciales REALES. Validado empíricamente con gitleaks: una OpenAI
# `sk-…T3BlbkFJ…`, un JWT firmado completo, y llaves AWS/GitHub siguen BLOQUEANDO el merge; solo pasan
# los shapes de EJEMPLO del corpus (JWT truncados con `...`) y los literales de abajo. Control
# negativo re-medido 2026-10-12: un `ghp_` + 36 alfanuméricos aleatorios, un JWT completo, una
# `sk-proj-…` y una `sk-ant-api03-…` sembrados fuera del repo marcan.

[extend]
useDefault = true

[allowlist]
description = "Ejemplos de documentación (placeholders ilustrativos) + artefactos de build"

paths = [
  '''node_modules/.*''',
  '''build/.*''',
  '''\.docusaurus/.*''',
  '''\.gitleaks\.toml''',
]

regexes = [
  # JWT de ejemplo: SOLO truncados con `...` (los del corpus). Un JWT firmado real NO contiene `...`.
  '''eyJ[A-Za-z0-9_-]+\.\.\.''',
  # ── Valores de EJEMPLO del OpenAPI publicado en `static/openapi/*.json` ────
  # Ese archivo se regenera con `pnpm fetch-openapi` desde el OpenAPI PÚBLICO de
  # la API y trae bloques `"example"` con credenciales de mentira que imitan la
  # forma real. NO se pueden cubrir por FORMA, y esto es lo importante: medido en
  # `1platform-api/app/services/auth/auth_user_service.py:428`, un token real es
  # `sk-{secrets.token_urlsafe(24)}` — 35 caracteres, exactamente el largo del
  # ejemplo. Aflojar de 28 a 35 el patrón de arriba dejaría pasar un token REAL
  # filtrado, así que van los literales, uno por uno.
  #
  # Consecuencia asumida: si un `fetch-openapi` cambia estos ejemplos, el check se
  # pone rojo hasta que una persona mire y actualice la lista. Para un archivo que
  # llega de un servicio en vivo, ése es el comportamiento correcto.
  '''^1p_whv_3f8Ka9Qb2Lm7Rz0Xt4Cy$''',
  '''^1p_whv_Qw5Er7Ty9Ui1Op3As6Df$''',
  '''^whsec_2c7b9a8e1f4d3c5a6b8e9d0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b$''',
  '''^whsec_4f8e7a9c2b1d0e3f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f$''',
  '''^5f1c0f2e-2a6d-4c3b-9f10-2b7c8d9e0a11$''',
  # 2026-10-12: `idempotency_key` del ejemplo de retiros (`cash_out`) que el OpenAPI regenerado
  # trae desde septiembre. Literal: una idempotency key no autentica, pero no se cubre la forma UUID.
  '''^3f2a91c8-5f4e-4a1b-9e77-2c0f4d6b8a11$''',
  # Quitados 2026-10-12 por no casar con NINGÚN hallazgo del árbol (medido con gitleaks 8.30.1 sin
  # allowlist sobre main 645a3fe: 17 hallazgos, ninguno de estas formas): el patrón corto
  # `^(?:ak|sk)-…{2,28}$`, el UUID FEL `A1B2C3D4…`, los literales `sk-QK2fV8x…`/`ak-QK2fV8x…`,
  # `client-supplied-uuid-v4` y `journeys/…`. Si un ejemplo vuelve, se agrega su literal.
]

# Reglas propias: el ruleset por defecto de gitleaks NO tiene una regla dedicada para las API keys
# de Anthropic ni para las de proyecto/servicio de OpenAI (sólo las caza por casualidad la heurística
# genérica `generic-api-key`, y sólo si el nombre de variable "suena" a credencial). El piso de
# longitud (80/40 chars) es lo que las separa de los placeholders cortos `ak-`/`sk-` de arriba, que
# el allowlist ya permite. Medido 2026-09-07 con gitleaks 8.30.1.
# Refs 1platformlabs/1platform-wiki#7

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-…)"
regex = 'sk-ant-(?:api|admin|sid)[0-9]{2}-[A-Za-z0-9_-]{80,120}'
keywords = ["sk-ant-"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project/user key (sk-proj-, sk-svcacct-, sk-admin-)"
regex = 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,}'
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]
