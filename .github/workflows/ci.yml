name: CI — Pull Request

# Validation only. This is deliberately NOT part of prod.yml: that workflow is
# the deployment pipeline, and giving it a `pull_request` trigger would drag the
# PROD environment and its credentials into every pull request.
#
# Until this file existed, nothing at all ran before a merge — a broken build, a
# broken internal link, a type error or prose contradicting the API was only
# discovered after it had already deployed, because prod.yml runs on push to
# main and this repo has no paths-ignore.
on:
  pull_request:
    branches: [main]

# No job needs to write anything. Read-only by default, narrowed per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, types and design system
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from `packageManager` in package.json, so CI and a
        # developer machine resolve the same pnpm rather than drifting.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Types are checked separately because `docusaurus build` transpiles TSX
      # with Babel and never type-checks it. A type error in the 347-line
      # sidebar swizzle compiled green and deployed.
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck

      # Proves the guard still fails on each tell BEFORE trusting it to pass.
      # A guard is only evidence if you have watched it fail.
      - name: Design-system guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:tells:self-test

      - name: Design-system guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:tells

      # The chrome ported from the marketing site draws with the shared tokens;
      # this pins every text/surface pair to AA (site epic home-landing-redesign,
      # LMW-12 CA-7). Self-test first: a checker nobody has watched fail is not
      # a gate.
      - name: Chrome contrast — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:chrome-contrast:self-test

      - name: Chrome contrast
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:chrome-contrast

      # Same discipline for the contract-drift gate: watch it fail on every one
      # of its tells — and pass on legitimate content — before trusting a green.
      # Its false-positive cases are as load-bearing as its false-negative ones:
      # a gate that blocks a good PR is a gate someone switches off.
      - name: Contract-drift guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:contract:self-test

      # The prose must not restate what the OpenAPI reference already publishes.
      # Measured against origin/main with this same script, it fails with 192
      # pasted response bodies, 3 citations of operations that do not exist and
      # 48 retyped schema tables — 243 findings. Green here means the tree
      # changed, not that the guard went quiet.
      - name: Contract-drift guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:contract

      # The capability table is nothing but anchors into the API reference, and
      # onBrokenAnchors cannot police them: the reference renders client-side,
      # so at build time none of its ids exist and 'throw' fails on all of them
      # (measured: 21 of 21 on an untouched tree). This reads the same spec the
      # reference renders and checks that every slug names a tag that is in it.
      - name: API-anchor guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:anchors:self-test

      - name: API-anchor guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:anchors

      # onBrokenLinks:'throw' — a bad internal link fails here.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build

      # Reads the generated pages, not the source approximation: canonical and
      # hreflang, real CTA hrefs, search/keyboard controls, reduced motion,
      # focus visibility, review snapshots and first-party asset budgets all live
      # here.
      - name: Public UI contract — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:public-ui:self-test

      - name: Public UI contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:public-ui

  dependencias:
    name: Auditoría de dependencias
    # Sin `needs:`: corre EN PARALELO con `validate`, para no alargar el camino
    # crítico del PR y que su veredicto se lea solo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # NO hace falta `pnpm install`: `pnpm audit` resuelve el árbol desde
      # `pnpm-lock.yaml`. Verificado en un clon limpio sin `node_modules`.

      # El auto-test PRIMERO: una compuerta que nadie vio fallar no es
      # evidencia, y el error que ésta existe para evitar es que "encontré
      # vulnerabilidades" y "no pude medir" se lean iguales. El auto-test
      # comprueba justamente que se leen distinto.
      - name: La compuerta discrimina — auto-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:audit:self-test

      # `pnpm audit` sale 1 tanto si encontró vulnerabilidades como si no pudo
      # alcanzar el servicio de advisories (medido con pnpm 10.34.5), así que la
      # salida se captura con `|| true` y el veredicto lo decide el script, que
      # sí distingue los dos casos.
      - name: Auditoría de dependencias de producción
        shell: bash
        run: |
          set -uo pipefail
          pnpm audit --prod --json > audit.json || true
          node scripts/audit-critical.mjs audit.json

  sonarcloud:
    # ⚠️ `name:` EXACTO — es el contexto que se marca requerido en la protección
    # de `main`. Cambiarlo desengancha la compuerta sin que nada avise.
    name: SonarCloud Code Analysis
    # Sin `needs:`: el escáner lee las fuentes, no el `build/`, así que no
    # depende del build y no tiene por qué esperarlo.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El análisis de código NUEVO se apoya en `git blame`: sin historia
          # completa SonarCloud no sabe qué líneas son del PR.
          fetch-depth: 0

      # NO hay paso de descarga de cobertura, y es deliberado: este repo no
      # produce ninguna — no tiene runner de tests unitarios, y `tests/` sólo
      # guarda líneas base visuales en PNG. Por eso `sonar-project.properties`
      # trae `sonar.coverage.exclusions=**`: sin reporte, el gate mediría 0 % en
      # código nuevo y fallaría por FALTA DE DATOS y no por calidad.

      - name: Check for SONAR_TOKEN
        id: sonar_token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ES_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "${ES_FORK}" = "true" ]; then
            MOTIVO="el PR viene de un fork, que por diseño no recibe los secretos del repositorio"
            echo "::warning::SonarCloud NO analizó este PR: ${MOTIVO}."
          else
            MOTIVO="el secreto SONAR_TOKEN no llegó a este job, y este PR NO viene de un fork"
            echo "::error::SonarCloud NO analizó este PR: ${MOTIVO}. La credencial vive en la organización (gh secret list --org 1platformlabs)."
          fi
          {
            echo "## SonarCloud NO analizó este PR"
            echo
            echo "Este check está en verde y **no midió nada**."
            echo
            echo "**Motivo:** ${MOTIVO}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SonarCloud Scan
        id: sonar_scan
        if: steps.sonar_token.outputs.present == 'true'
        # Pinneada al SHA, no al tag: `githubactions:S7637` — un tag móvil deja
        # que el dueño de la acción cambie lo que corre en un job que recibe
        # `SONAR_TOKEN` y `GITHUB_TOKEN`.
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        # INFORMATIVO en la primera corrida, A PROPÓSITO. Este repositorio nunca
        # tuvo una corrida del escáner: medido el 2026-09-04 contra
        # `api/projects/search?organization=1platformlabs`, no existe el proyecto
        # `1platformlabs_1platform-api-developer`. O sea que el color del gate es
        # literalmente desconocido, y el primer análisis puede incluso rebotar
        # con "project not found". Sin esta línea, un primer gate rojo no bloquea
        # UN PR: congela TODO merge del repositorio. Se quita después de dos o
        # tres PRs midiendo.
        #
        # `sonar.qualitygate.wait` NO se pone por la misma razón: esperar el
        # veredicto sólo tiene sentido cuando el veredicto ya se conoce.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El host, EXPLÍCITO: sin esto el escáner CLI 7.x pide
          # `/api/v2/analysis/jres` y `sonarcloud.io` responde 404, con un error
          # que MIENTE ("check the property sonar.token"). Y es intermitente:
          # si el runner tiene el escáner en caché no baja el JRE y no falla.
          SONAR_HOST_URL: https://sonarcloud.io

  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"   # verificada contra el release el 2026-09-04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks

      # La casa no le cree a un detector que no demostró discriminar — mismo
      # patrón que los `:self-test` de los otros guards de este workflow. El
      # token falso se CONSTRUYE acá: el literal no vive nunca en el repo, así
      # que este paso no se vuelve el hallazgo de la próxima auditoría.
      - name: El detector discrimina (secreto sembrado)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          FALSO="ghp_$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'token = "%s"\n' "$FALSO" > "$TMP/sembrado.txt"
          if ./gitleaks detect --source "$TMP" --no-git --config .gitleaks.toml --redact --exit-code 1; then
            echo "::error::gitleaks NO marcó el secreto sembrado — este gate no discrimina."
            exit 1
          fi
          rm -rf "$TMP"

      # `--no-git` escanea el ÁRBOL, no el historial: caza el secreto que se
      # está agregando, no el que ya está commiteado. El barrido histórico es
      # una tarea aparte.
      - name: Secretos en el árbol
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1
