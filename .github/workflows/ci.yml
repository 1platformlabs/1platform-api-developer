name: CI — Pull Request

# Validation only. This is deliberately NOT part of prod.yml: that workflow is
# the deployment pipeline, and giving it a `pull_request` trigger would drag the
# PROD environment and its credentials into every pull request.
#
# Until this file existed, nothing at all ran before a merge — a broken build, a
# broken internal link, a type error or prose contradicting the API was only
# discovered after it had already deployed, because prod.yml runs on push to
# main and this repo has no paths-ignore.
on:
  pull_request:
    branches: [main]

# No job needs to write anything. Read-only by default, narrowed per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, types and design system
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from `packageManager` in package.json, so CI and a
        # developer machine resolve the same pnpm rather than drifting.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Types are checked separately because `docusaurus build` transpiles TSX
      # with Babel and never type-checks it. A type error in the 347-line
      # sidebar swizzle compiled green and deployed.
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck

      # Proves the guard still fails on each tell BEFORE trusting it to pass.
      # A guard is only evidence if you have watched it fail.
      - name: Design-system guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:tells:self-test

      - name: Design-system guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:tells

      # The chrome ported from the marketing site draws with the shared tokens;
      # this pins every text/surface pair to AA (site epic home-landing-redesign,
      # LMW-12 CA-7). Self-test first: a checker nobody has watched fail is not
      # a gate.
      - name: Chrome contrast — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:chrome-contrast:self-test

      - name: Chrome contrast
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:chrome-contrast

      # Same discipline for the contract-drift gate: watch it fail on every one
      # of its tells — and pass on legitimate content — before trusting a green.
      # Its false-positive cases are as load-bearing as its false-negative ones:
      # a gate that blocks a good PR is a gate someone switches off.
      - name: Contract-drift guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:contract:self-test

      # The prose must not restate what the OpenAPI reference already publishes.
      # Measured against origin/main with this same script, it fails with 192
      # pasted response bodies, 3 citations of operations that do not exist and
      # 48 retyped schema tables — 243 findings. Green here means the tree
      # changed, not that the guard went quiet.
      - name: Contract-drift guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:contract

      # The capability table is nothing but anchors into the API reference, and
      # onBrokenAnchors cannot police them: the reference renders client-side,
      # so at build time none of its ids exist and 'throw' fails on all of them
      # (measured: 21 of 21 on an untouched tree). This reads the same spec the
      # reference renders and checks that every slug names a tag that is in it.
      - name: API-anchor guard — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:anchors:self-test

      - name: API-anchor guard
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:anchors

      # onBrokenLinks:'throw' — a bad internal link fails here.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build

      # Reads the generated pages, not the source approximation: canonical and
      # hreflang, real CTA hrefs, search/keyboard controls, reduced motion,
      # focus visibility, review snapshots and first-party asset budgets all live
      # here.
      - name: Public UI contract — self-test
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:public-ui:self-test

      - name: Public UI contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:public-ui

  # ---------------------------------------------------------------------------
  # SonarCloud — SOLO en pull requests (epica `sonar-solo-en-pr`).
  #
  # El `if:` va en el JOB y no en el `on:` a proposito. Lo que cuesta cuota es
  # el analisis de `main`: el `nclocCount` que factura la organizacion es la
  # suma del `ncloc` de las ramas `main`, y un proyecto con PRs analizados y
  # `main` sin analizar aporta 0. Por eso este job no corre fuera de un PR, y
  # agregarle un disparador de `push` reintroduce exactamente el costo que la
  # epica retiro.
  #
  # INFORMATIVO: Sonar no es contexto requerido de `main` en este repo y este
  # job no lo vuelve requerido (`continue-on-error` en el escaneo). El veredicto
  # se publica igual, como check-run propio de SonarCloud.
  #
  # El sufijo del `name:` es deliberado: la app de SonarCloud publica su propio
  # check-run llamado exactamente `SonarCloud Code Analysis`, y sin el sufijo
  # hay dos checks homonimos de apps distintas en el mismo commit.
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Code Analysis (Actions — informativo)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # OBLIGATORIO. Sin `permissions:` propio el job hereda el `permissions: {}`
    # del workflow (cuando lo hay): un GITHUB_TOKEN sin alcance, y el checkout
    # falla con 403 antes de que el escaner corra.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El analisis de codigo NUEVO se apoya en `git blame`: con un checkout
          # superficial SonarCloud no sabe que lineas trae este PR.
          fetch-depth: 0

      - name: Check for SONAR_TOKEN
        id: sonar_token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          # Dependabot no ve los secretos de Actions: los suyos viven en otro
          # espacio de nombres, y darle el token reabre la exfiltracion desde el
          # build de una dependencia.
          ES_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${ES_DEPENDABOT:-false}" = "true" ] || [ "${IS_FORK:-false}" = "true" ]; then
            # Los dos casos en que el token NO llega por diseno de GitHub: el
            # autor no puede hacer nada para que aparezca.
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${ES_DEPENDABOT:-false}" = "true" ]; then
              MOTIVO="el PR lo abrio Dependabot, que por diseno no recibe los secretos de Actions"
            else
              MOTIVO="el PR viene de un fork, que por diseno no recibe los secretos"
            fi
            echo "::warning::SonarCloud NO analizo este PR: ${MOTIVO}."
            {
              echo "## SonarCloud NO analizo este PR"
              echo
              echo "Este check esta en verde y **no midio nada**."
              echo
              echo "**Motivo:** ${MOTIVO}."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Cualquier otro PR sin token es un defecto de configuracion: el
            # secreto vive en la organizacion. Falla en vez de pasar en falso.
            echo "::error::SONAR_TOKEN no esta disponible en este job y el PR no viene de un fork ni de Dependabot. El analisis NO corrio."
            exit 1
          fi

      - name: SonarCloud Scan
        if: steps.sonar_token.outputs.present == 'true'
        # Pinneada al SHA, no al tag: `githubactions:S7637` — un tag movil deja
        # que el duenio de la accion cambie lo que corre en un job que recibe
        # `SONAR_TOKEN` y `GITHUB_TOKEN`.
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El host, EXPLICITO. Sin esto el escaner CLI 7.x pide
          # `/api/v2/analysis/jres`, `sonarcloud.io` responde 404 y el fallo se
          # lee como un problema de credenciales. Es INTERMITENTE: si el runner
          # tiene el escaner en cache no baja el JRE y no falla.
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Espera el veredicto: sin esto el paso termina en verde apenas sube el
          # analisis, antes de que exista el resultado del gate.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
