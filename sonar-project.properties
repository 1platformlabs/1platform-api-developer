sonar.projectKey=1platformlabs_1platform-api-developer
sonar.organization=1platformlabs

# ⚠️ ESTE archivo define el alcance del análisis, y su sola existencia apaga el
# Análisis Automático de SonarCloud (que lee `.sonarcloud.properties`, no éste).
# Acá no había ninguno de los dos: medido el 2026-09-04 contra
# `api/projects/search?organization=1platformlabs`, la organización tiene 14
# proyectos y NINGUNO es `1platformlabs_1platform-api-developer`. Este
# repositorio no lo analizaba nadie.
#
# ⚠️ CLAVE DE PROYECTO. En la organización SÍ existe
# `1platformlabs_1platform-atlas-api-developer`, cuyo nombre se parece lo
# suficiente como para que alguien lo tome por éste. NO lo es, y no se reutiliza:
# medido el mismo día, ese proyecto tiene `analyses: 0`, `measures: []` y ningún
# enlace — está vacío, y no hay repositorio `1platform-atlas-api-developer` en la
# organización de GitHub. Apuntar ahí sería publicar el análisis de este repo
# bajo el nombre de otro producto. El precedente inverso vale la pena tenerlo
# presente: en `1platform-media-api` la clave correcta NO deriva del nombre del
# repositorio (`1platformlabs_1platform-olympus-media-api`), y escribir la
# "obvia" habría creado un proyecto segundo y vacío.
#
# Como el proyecto no existe, la PRIMERA corrida del escáner puede rebotar con
# "project not found". Por eso el paso lleva `continue-on-error` en `ci.yml`.
#
# CUOTA. La organización consumía 250.294 ncloc de un techo de 300.000 el
# 2026-09-04: quedan ~49.700 líneas. Este repositorio tiene 132.549 renglones
# sólo en `static/` (84.641 del `openapi/1platform-api.json` y 46.354 del
# `atlas-api.json`): sin acotar el alcance, el análisis lo manda como código de
# producción, la organización toca el techo, y TODOS los análisis de TODOS los
# repos rebotan con "This analysis will make your organization reach the maximum
# allowed lines limit". Esa exclusión no es prolijidad: es la diferencia entre
# que el ecosistema entero siga midiendo o deje de hacerlo.
#
# El job dispara SÓLO en `pull_request`, y eso también importa para la cuota:
# los análisis de PR no acumulan ncloc en la organización, los de la rama
# principal sí (medido en `1platform-atlas-app` contra `api/billing/show`). La
# contra queda dicha: se ve sólo lo que cada PR toca, nunca el código existente.

# Lo que este repositorio tiene de código: los 10 `.tsx` y 3 `.ts` de `src/`
# (swizzles de Docusaurus, ~830 líneas), su CSS (~1.530), los 4 `.mjs` de
# `scripts/` (guards de anclas, contraste, contrato y UI pública, ~445) y la
# configuración de la raíz. Los `.sh` de `scripts/` quedan declarados pero
# SonarCloud no tiene analizador de shell: no producen ncloc ni hallazgos.
sonar.sources=src,scripts,docusaurus.config.ts,sidebars.ts

# NO se declara `sonar.tests`: este repo no tiene tests de código. `tests/` son
# 4 PNG de línea base visual y un README — declararlo no aportaría ni una regla.
# Cuando aparezca una suite de verdad, se agrega acá.

# Fuera del análisis:
#   static/**   los dos OpenAPI (131.000 líneas de JSON) y las fuentes/imágenes
#   docs/**     132 `.md` y 39 `.mdx`: es la documentación, o sea el producto,
#               pero no código que una regla estática pueda juzgar
#   i18n/**     catálogo de traducción
#   tests/**    líneas base visuales en PNG
#   deploy/**   shell y nginx.conf del despliegue
sonar.exclusions=**/node_modules/**,build/**,.docusaurus/**,static/**,docs/**,i18n/**,tests/**,deploy/**

# COBERTURA: NO SE MIDE, y es un hueco conocido, no un olvido — este repo no
# tiene runner de tests unitarios. Se excluye todo A PROPÓSITO: sin reporte, el
# gate mediría 0 % de cobertura en código nuevo y fallaría por FALTA DE DATOS y
# no por calidad, que es el modo de fallo que termina con alguien apagando el
# gate. Con esta línea el gate evalúa fiabilidad, seguridad, mantenibilidad,
# duplicación y hotspots, que es donde está el grueso del valor.
sonar.coverage.exclusions=**

sonar.sourceEncoding=UTF-8
